# ============================================================
# Clash Party 覆写 rules4.5｜人在中国大陆使用（2026-10-29）
#
# 分工：终端只决定 DIRECT / PROXY；PROXY 选「自动分流」节点，
# 到达 VPS 后由 3x-ui 路由表（住宅ip路由规则4.5）决定走住宅还是 VPS 出口。
# 终端里的显式 PROXY 规则只为一件事：防止被后面的 GEOSITE,cn / GEOIP,CN 误判直连。
# 与 iPhone 端 myconfig4.5.conf 同版本、同口径。
# ============================================================

mode: rule

# 不使用 IPv6。
ipv6: false

# 进程识别：用于迅雷整体直连。
find-process-mode: strict

# 域名嗅探：App 直接用 IP 连接时，从 TLS/HTTP/QUIC 中还原域名用于规则匹配。
# override-destination 保持 false：发往 VPS 的仍是原目标，由 3x-ui 入站嗅探在 VPS 端还原域名。
# 「嗅探覆写」开关保持关闭，以本文件为准。
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"
  # Telegram 使用 MTProto 直连 IP，不做嗅探
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - localhost.ptlogin2.qq.com
    - captive.apple.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 命中 DIRECT 的连接统一用国内 DNS 解析，保证直连金融类网站「DNS 与出口都在国内」。
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "geosite:cn,apple-cn":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query#PROXY"
      - "https://8.8.8.8/dns-query#PROXY"

rules:
  # 广告拦截不启用：category-ads-all 会误拦 OpenAI / TikTok 等服务的统计子域名。

  # 1. 本地和私有网络
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 2. 迅雷：整体直连，不进 VPS（VPS 端屏蔽 BT）
  - PROCESS-NAME,Thunder,DIRECT
  - PROCESS-NAME,迅雷,DIRECT

  # 2.1 Claude Mac App 与 Claude Code：按程序整体走代理（域名规则之外再加一道保险）
  - PROCESS-NAME,Claude,PROXY
  - PROCESS-NAME,Claude Helper,PROXY
  - PROCESS-NAME,Claude Helper (Renderer),PROXY
  - PROCESS-NAME,Claude Helper (GPU),PROXY
  - PROCESS-NAME,Claude Helper (Plugin),PROXY
  - PROCESS-NAME,claude,PROXY

  # 3. Apple / iCloud：统一直连（国区 Apple ID）
